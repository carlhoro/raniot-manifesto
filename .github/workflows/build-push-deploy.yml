name: Build, Push and Deploy (Raniot)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: raniot-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/raniot-manifesto

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image tagged with commit SHA and latest
        run: |
          docker build -t "$IMAGE_NAME:$GITHUB_SHA" -t "$IMAGE_NAME:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Configure SSH key and known hosts
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_DEPLOY_PRIVATE_KEY_B64 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DESKTOP_PRIVATE_KEY_DEPLOY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "Missing secret VPS_HOST" >&2; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          umask 077
          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            # Base64 preserves the OpenSSH key's exact bytes when stored as a single-line secret.
            printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          elif [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          else
            echo "Missing secret SSH_DEPLOY_PRIVATE_KEY_B64 (or legacy SSH_DESKTOP_PRIVATE_KEY_DEPLOY)" >&2
            exit 1
          fi
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null || {
            echo "Invalid SSH private key. Check the encoding of the SSH secret." >&2
            exit 1
          }
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy main to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ secrets.RANIOT_APP_DIR }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_USER" || { echo "Missing secret DEPLOY_USER" >&2; exit 1; }
          test -n "$APP_DIR" || { echo "Missing secret RANIOT_APP_DIR" >&2; exit 1; }
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid RANIOT_APP_DIR path" >&2; exit 1; }
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$VPS_HOST" "bash -se -- '$IMAGE' '$TAG' '$APP_DIR'" <<'REMOTE'
          set -euo pipefail
          IMAGE="$1"
          TAG="$2"
          APP_DIR="$3"

          REMOTE_USER="$(id -un)"
          test -w "$APP_DIR" || { echo "$REMOTE_USER cannot write to $APP_DIR" >&2; exit 1; }
          docker info > /dev/null || { echo "$REMOTE_USER cannot access the Docker daemon" >&2; exit 1; }

          test -d "$APP_DIR/.git" || { echo "Repository missing at $APP_DIR" >&2; exit 1; }
          cd "$APP_DIR"
          git fetch origin main
          git switch main || git switch -c main --track origin/main
          git pull --ff-only origin main

          touch .env
          sed -i '/^GHCR_IMAGE=/d; /^IMAGE_TAG=/d' .env
          printf '\nGHCR_IMAGE=%s\nIMAGE_TAG=%s\n' "$IMAGE" "$TAG" >> .env

          docker compose config --quiet
          docker compose pull app
          docker compose up -d --no-build app
          echo "Deploy completed: $IMAGE:$TAG"
          REMOTE
