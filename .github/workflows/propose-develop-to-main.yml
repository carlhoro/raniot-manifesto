name: Propose develop to main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Open promotion PR when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if git diff --quiet origin/main HEAD; then
            echo "main and develop have identical content; nothing to propose."
            exit 0
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An open develop to main PR already exists."
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head develop \
            --title "Promote develop to main" \
            --body "Validated on develop with npm ci, npm run test and npm run build. Review and merge manually after checking the target branch requirements."
